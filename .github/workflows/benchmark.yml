name: T7 Tensor Matrix Performance Benchmark

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  benchmark-matrix-operations:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-benchmark numpy
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Tensor Benchmark Suite
      run: |
        PYTHONPATH=. python -m pytest tests/test_benchmark_t7.py --benchmark-only --benchmark-autosave
        
