name: Topology & FDTD Matrix Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Required for Conda to activate correctly in GitHub Actions
    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Conda Environment
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: '3.10'
        miniforge-version: 'latest'
        channels: conda-forge
        channel-priority: strict

    - name: Install PyMeep via Conda
      run: |
        conda install -c conda-forge pymeep

    - name: Install Remaining Python Dependencies
      run: |
        pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Execute Matrix Algebra & T7 Filter Tests
      run: |
        pytest tests/ -v
        
